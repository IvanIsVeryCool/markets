<style>
/* Resolved: play-money prediction markets on NPDI. Markets along the top, the chart and the contracts in the middle,
   the order ticket on the right (a sheet from the bottom on phones). Play money, kept in this browser. */
:root{
  --bg:#f4f3f0; --card:#fff; --line:#e6e4df; --line2:#d7d4cd;
  --ink:#16181f; --ink2:#4f525c; --muted:#7a7d86;
  --amber:#ffad1f;
  --yes:#0f8a5f; --yes-bg:#e5f4ed; --yes-bg2:#d2ecdf;
  --no:#6a47c9; --no-bg:#efeafb; --no-bg2:#e1d8f6;
  --up:#0f8a5f; --down:#c9272c; --go-ink:#fff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --grid:#ecebe7;
  --display:'Inter Tight','Inter',system-ui,sans-serif;
  --body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:6px; --lift:0 1px 2px rgba(20,22,30,.06),0 6px 20px rgba(20,22,30,.06);
  --ease:cubic-bezier(.16,1,.3,1);
  --gut:clamp(16px,3vw,32px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121317; --card:#1b1c21; --line:#2a2c33; --line2:#373a42;
    --ink:#f0efec; --ink2:#c3c2bc; --muted:#8e9099;
    --yes:#3cc08b; --yes-bg:#16302a; --yes-bg2:#1c3d34;
    --no:#a08cf0; --no-bg:#25213a; --no-bg2:#2f2948;
    --up:#3cc08b; --down:#ef6a6a; --go-ink:#0d1712;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --grid:#24262c; --lift:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121317; --card:#1b1c21; --line:#2a2c33; --line2:#373a42;
  --ink:#f0efec; --ink2:#c3c2bc; --muted:#8e9099;
  --yes:#3cc08b; --yes-bg:#16302a; --yes-bg2:#1c3d34;
  --no:#a08cf0; --no-bg:#25213a; --no-bg2:#2f2948;
  --up:#3cc08b; --down:#ef6a6a; --go-ink:#0d1712;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --grid:#24262c; --lift:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
.mark{display:block;flex:none}
.mk-bg{fill:var(--ink)} .mk-bar{fill:var(--card)} .mk-up{fill:var(--yes)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cap{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}

/* top bar: back to the platform, the wordmark, your play money */
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:calc(10px + env(safe-area-inset-top,0px)) var(--gut) 10px}
.back{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;border:1px solid var(--line2);border-radius:var(--r);color:var(--ink);text-decoration:none;background:var(--card)}
.back svg{width:14px;height:14px}
.back:hover{border-color:var(--ink2)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand .mark{width:28px;height:28px}
.brand b{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--muted);font-weight:600;font-size:12.5px;padding-left:10px;border-left:1px solid var(--line2)}
.bal{margin-left:auto;display:flex;align-items:center;gap:6px}
.bal button{display:flex;flex-direction:column;align-items:flex-end;padding:4px 10px;border-radius:var(--r);line-height:1.15}
.bal button:hover{background:var(--bg)}
.bal small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.bal strong{font-weight:700;font-size:15px}
.bal .sep{width:1px;height:28px;background:var(--line)}

/* market chips */
.mkts{max-width:1240px;margin:0 auto;padding:14px var(--gut) 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.mkts::-webkit-scrollbar{display:none}
.mkt{flex:none;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:4px;background:var(--card);font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.mkt em{font-style:normal;font-weight:700;color:var(--ink)}
.mkt:hover{border-color:var(--ink2)}
.mkt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.mkt[aria-pressed="true"] em{color:var(--card)}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:18px var(--gut) calc(60px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}

/* market head */
.head{display:flex;gap:16px;align-items:flex-start;padding:20px 20px 0}
.head .ic{flex:none;width:52px;height:52px;border-radius:var(--r);background:var(--ink);color:var(--card);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.head .ic svg{width:26px;height:26px}
.kick{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kick i{width:3px;height:3px;border-radius:50%;background:var(--muted)}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--yes)}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1.12;letter-spacing:-.01em;margin-top:4px}

/* the headline number (binary markets) */
.hero{display:flex;align-items:baseline;gap:12px;padding:14px 20px 0}
.hero b{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em}
.hero span{color:var(--muted);font-weight:600}
.chg{font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:2px}
.chg.up{color:var(--up)} .chg.down{color:var(--down)} .chg.flat{color:var(--muted)}
.chg svg{width:10px;height:10px}

/* chart */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:14px 20px 0;min-height:36px}
.legend .k{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);font-weight:600}
.legend .k i{width:10px;height:10px;border-radius:2px}
.legend .k b{color:var(--ink);font-weight:700}
.legend .when{margin-left:auto;color:var(--muted);font-size:12.5px;font-weight:600}
.chart{position:relative;margin:4px 8px 0 20px;height:260px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .yl{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .xl{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.dim{opacity:.25}
.chart .hair{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 3}
.chart .dot{stroke:var(--card);stroke-width:2}
.tip{position:absolute;top:0;pointer-events:none;background:var(--card);border:1px solid var(--line2);border-radius:4px;box-shadow:var(--lift);padding:7px 9px;font-size:12px;min-width:120px;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip .t{color:var(--muted);font-weight:600;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip .r i{width:8px;height:8px;border-radius:2px;flex:none}
.tip .r b{margin-left:auto;padding-left:10px}
.ranges{display:flex;gap:2px;padding:6px 20px 16px;align-items:center}
.ranges button{height:28px;padding:0 10px;border-radius:4px;font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.04em}
.ranges button:hover{color:var(--ink)}
.ranges button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.ranges .vol{margin-left:auto;color:var(--muted);font-size:12.5px;font-weight:600}

/* contracts */
.list{border-top:1px solid var(--line)}
.lhead{display:grid;grid-template-columns:minmax(0,1fr) 110px 196px;gap:12px;padding:10px 20px;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;align-items:center}
.lhead .sort{display:flex;gap:4px}
.lhead .sort button{font:inherit;letter-spacing:inherit;color:var(--muted);padding:2px 6px;border-radius:4px}
.lhead .sort button[aria-pressed="true"]{color:var(--ink);background:var(--bg)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 110px 196px;gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);cursor:pointer;transition:background .2s}
.row:hover{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.row.sel{background:var(--bg)}
.row.flash-up{animation:fu 1.2s ease}
.row.flash-down{animation:fd 1.2s ease}
@keyframes fu{0%{background:var(--yes-bg)}100%{background:transparent}}
@keyframes fd{0%{background:color-mix(in srgb,var(--down) 14%,transparent)}100%{background:transparent}}
.who{display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.badge{flex:none;width:36px;height:36px;border-radius:4px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;color:#fff;position:relative}
.badge .sw{position:absolute;left:-1px;bottom:-1px;width:10px;height:10px;border-radius:2px;border:2px solid var(--card)}
.who .nm{min-width:0}
.who .nm b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .nm small{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;font-weight:600}
.pct{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.pct b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn{height:40px;border-radius:var(--r);font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:5px;transition:background .15s}
.yn.y{background:var(--yes-bg);color:var(--yes)}
.yn.y:hover,.yn.y.on{background:var(--yes-bg2)}
.yn.n{background:var(--no-bg);color:var(--no)}
.yn.n:hover,.yn.n.on{background:var(--no-bg2)}
.yn.on{box-shadow:inset 0 0 0 2px currentColor}
.yn span{font-weight:600;opacity:.8}
.more{display:block;width:100%;padding:12px;border-top:1px solid var(--line);color:var(--ink2);font-weight:700;font-size:13px}
.more:hover{color:var(--ink)}
.big-yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px;border-top:1px solid var(--line)}
.big-yn .yn{height:52px;font-size:16px}

/* rules, positions, activity */
.tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{height:40px;padding:0 10px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tabs button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:3px;background:var(--bg);font-size:11.5px;line-height:18px;text-align:center}
.pane{padding:16px 20px 20px}
.pane[hidden]{display:none}
.rules p{color:var(--ink2);max-width:62ch}
.rules dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:14px 0 0;font-size:13.5px}
.rules dt{color:var(--muted);font-weight:600}
.rules dd{margin:0;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:18px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0;white-space:normal}
th:last-child,td:last-child{padding-right:0}
td .c{font-weight:700}
td .s{display:block;color:var(--muted);font-size:12px;font-weight:600}
.side-y{color:var(--yes);font-weight:700} .side-n{color:var(--no);font-weight:700}
.pl.up{color:var(--up)} .pl.down{color:var(--down)}
.mini{height:28px;padding:0 10px;border:1px solid var(--line2);border-radius:4px;font-weight:700;font-size:12px;background:var(--card)}
.mini:hover{border-color:var(--ink2)}
.sum{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px}
.sum div small{display:block;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.sum div b{font-family:var(--display);font-weight:800;font-size:20px}
.reset{color:var(--muted);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:2px;margin-top:14px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed li:last-child{border-bottom:0}
.feed li .what{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed li .usd{font-weight:700;text-align:right}
.feed li .meta{color:var(--muted);font-size:12px;font-weight:600}
.feed li .px{color:var(--muted);font-size:12px;font-weight:600;text-align:right}
.feed li.mine .what::before{content:"You";font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--card);background:var(--ink);border-radius:3px;padding:1px 4px;margin-right:6px}
.feed li.new{animation:fu 1.2s ease}

/* order ticket */
.ticket{position:sticky;top:74px}
.tk-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.tk-head .badge{width:40px;height:40px}
.tk-head .nm{min-width:0;flex:1}
.tk-head .nm small{display:block;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-head .nm b{display:block;font-weight:700;font-size:16px;line-height:1.2}
.tk-close{display:none;width:34px;height:34px;border-radius:var(--r);place-items:center;color:var(--ink2)}
.tk-close svg{width:16px;height:16px}
.bs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line)}
.bs button{height:36px;padding:0 8px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.bs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tk-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.tk-yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tk-yn .yn{height:44px;font-size:14.5px}
.tk-yn .yn:not(.on){background:var(--bg);color:var(--ink2)}
.field label{display:flex;justify-content:space-between;color:var(--ink2);font-size:13px;font-weight:600;margin-bottom:6px}
.field label span{color:var(--muted)}
.amt{display:flex;align-items:center;border:1px solid var(--line2);border-radius:var(--r);padding:0 12px;height:52px;background:var(--card)}
.amt:focus-within{border-color:var(--ink)}
.amt i{font-style:normal;color:var(--muted);font-family:var(--display);font-weight:700;font-size:22px}
.amt input:focus-visible{outline:none}
.amt input{flex:1;min-width:0;border:0;background:none;font-family:var(--display);font-weight:800;font-size:24px;text-align:right;padding:0;-moz-appearance:textfield}
.amt input::-webkit-outer-spin-button,.amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.quick button{height:30px;border:1px solid var(--line2);border-radius:4px;font-weight:700;font-size:12.5px;background:var(--card)}
.quick button:hover{border-color:var(--ink2)}
.est{display:grid;gap:7px;font-size:13.5px}
.est div{display:flex;justify-content:space-between;gap:12px}
.est dt,.est span{color:var(--ink2)}
.est .win b{color:var(--yes);font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.est .win.n b{color:var(--no)}
.est .win small{display:block;text-align:right;color:var(--muted);font-weight:600;font-size:12px}
.go{height:48px;border-radius:var(--r);font-weight:700;font-size:15px;color:var(--go-ink);background:var(--yes);transition:filter .15s,opacity .15s}
.go.n{background:var(--no)}
.go:hover{filter:brightness(1.08)}
.go:disabled{opacity:.4;cursor:default;filter:none}
.warn{color:var(--down);font-size:12.5px;font-weight:600;min-height:18px;margin-top:-6px}
.fine{color:var(--muted);font-size:11.5px;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--card);border-radius:var(--r);box-shadow:var(--lift);padding:11px 16px;font-weight:600;font-size:14px;max-width:calc(100vw - 32px);transition:opacity .25s,transform .35s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
.foot{max-width:1240px;margin:0 auto;padding:0 var(--gut) 40px;color:var(--muted);font-size:12.5px}

@media (max-width:920px){
  .wrap{grid-template-columns:1fr}
  .ticket{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:12px 12px 0 0;border-bottom:0;max-height:88vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s linear .4s;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  .ticket.open{transform:none;visibility:visible;transition:transform .4s var(--ease)}
  .tk-close{display:grid}
  .scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(10,12,18,.45);opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.on{opacity:1;pointer-events:auto}
}
@media (max-width:600px){
  #ev-name{display:none}
  .bal{gap:2px}
  .bal .sep{display:none}
  .bal button{padding:4px 6px}
  .sum{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .head{padding:16px 14px 0;gap:12px}
  .head .ic{width:42px;height:42px}
  .head .ic svg{width:22px;height:22px}
  .hero,.legend,.ranges{padding-left:14px;padding-right:14px}
  .chart{margin-left:14px;height:210px}
  .lhead{grid-template-columns:minmax(0,1fr) 140px;padding:10px 14px}
  .lhead .c3{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;padding:10px 14px;row-gap:8px}
  .row .btns{grid-column:1 / -1}
  .yn{height:38px}
  .big-yn{padding:14px}
  .pane{padding:14px}
  .hide-s{display:none}
}
@media (max-width:360px){.brand b{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="in">
    <a class="brand" href="/" aria-label="Resolved, all markets"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="mk-bg" width="32" height="32" rx="7"/><rect class="mk-bar" x="7" y="17" width="4.6" height="8" rx="1.4"/><rect class="mk-bar" x="13.7" y="12" width="4.6" height="13" rx="1.4"/><rect class="mk-up" x="20.4" y="7" width="4.6" height="18" rx="1.4"/></svg><b>Resolved</b><span id="ev-name"></span></a>
    <div class="bal">
      <button type="button" id="bal-port" aria-label="Portfolio"><small class="cash-lbl">Portfolio</small><strong id="port-val">$0.00</strong></button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="bal-cash" aria-label="Cash"><small>Cash</small><strong id="cash">$0.00</strong></button>
    </div>
  </div>
</header>

<nav class="mkts" id="mkts" aria-label="Markets"></nav>

<div class="wrap">
  <main>
    <section class="card" aria-labelledby="m-title">
      <div class="head">
        <div class="ic" id="m-ic" aria-hidden="true"></div>
        <div>
          <div class="kick"><span id="m-kick"></span><i></i><span class="live">Live</span></div>
          <h1 id="m-title"></h1>
        </div>
      </div>
      <div class="hero" id="hero" hidden></div>
      <div class="legend" id="legend"></div>
      <div class="chart" id="chart"><svg id="svg" role="img" aria-label="Price history"></svg><div class="tip" id="tip"></div></div>
      <div class="ranges" id="ranges">
        <button type="button" data-r="1d">1D</button><button type="button" data-r="1w">1W</button><button type="button" data-r="1m">1M</button><button type="button" data-r="all" aria-pressed="true">ALL</button>
        <span class="vol" id="vol"></span>
      </div>
      <div id="contracts"></div>
    </section>

    <section class="card" style="margin-top:20px">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="t-pos" aria-controls="p-pos" aria-selected="true">Positions<span class="n" id="pos-n">0</span></button>
        <button type="button" role="tab" id="t-act" aria-controls="p-act" aria-selected="false">Activity</button>
        <button type="button" role="tab" id="t-rules" aria-controls="p-rules" aria-selected="false">Rules</button>
      </div>
      <div class="pane" id="p-pos" role="tabpanel" aria-labelledby="t-pos"></div>
      <div class="pane" id="p-act" role="tabpanel" aria-labelledby="t-act" hidden><ul class="feed" id="feed"></ul></div>
      <div class="pane rules" id="p-rules" role="tabpanel" aria-labelledby="t-rules" hidden></div>
    </section>
  </main>

  <aside class="card ticket" id="ticket" aria-label="Order ticket">
    <div class="tk-head">
      <span class="badge" id="tk-badge"></span>
      <div class="nm"><small id="tk-mkt"></small><b id="tk-name"></b></div>
      <button type="button" class="tk-close" id="tk-close" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="bs" role="tablist">
      <button type="button" role="tab" id="tk-buy" aria-selected="true">Buy</button>
      <button type="button" role="tab" id="tk-sell" aria-selected="false">Sell</button>
    </div>
    <div class="tk-body">
      <div class="tk-yn">
        <button type="button" class="yn y on" id="tk-y">Yes <span id="tk-yp"></span></button>
        <button type="button" class="yn n" id="tk-n">No <span id="tk-np"></span></button>
      </div>
      <div class="field">
        <label for="tk-amt"><b id="tk-lbl">Amount</b><span id="tk-have"></span></label>
        <div class="amt"><i id="tk-unit">$</i><input id="tk-amt" type="number" inputmode="decimal" min="0" step="1" placeholder="0" autocomplete="off"></div>
        <div class="quick" id="tk-quick"></div>
      </div>
      <dl class="est" id="tk-est"></dl>
      <div class="warn" id="tk-warn" aria-live="polite"></div>
      <button type="button" class="go" id="tk-go" disabled>Buy</button>
      <p class="fine">Play money. Nothing here is real.</p>
    </div>
  </aside>
</div>
<p class="foot" id="foot"></p>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
